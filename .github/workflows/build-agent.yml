name: Build Remote agent installer

# Builds the BV Remote device agent into a silent Windows installer on a clean
# Windows runner (where electron-builder's tooling works), publishes it as a
# release asset, and records that asset's url + sha256 back into the repo so the
# dashboard always points at the build that actually exists. Runs on any change
# to the agent, or on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bv-remote/agent/**'
      - 'bv-remote/shared/**'
      - 'bv-remote/package.json'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
        working-directory: bv-remote/agent
      - name: Build the installer
        run: npm run dist
        working-directory: bv-remote/agent

      # nsis.perMachine MUST stay false. perMachine:true builds an installer
      # manifested RequestExecutionLevel=admin, so on a standard account Windows
      # demands an admin password before the installer will even start — even with
      # /S — and the silent deploy stalls there, needing someone at the machine.
      # This check enforces that: fail the build rather than publish one that prompts.
      - name: Check the installer needs no admin
        shell: pwsh
        run: |
          $exe = Get-ChildItem bv-remote/agent/dist/*.exe | Select-Object -First 1
          $text = [System.IO.File]::ReadAllText($exe.FullName, [System.Text.Encoding]::ASCII)
          $levels = [regex]::Matches($text, 'requestedExecutionLevel[^>]*level\s*=\s*"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          if (-not $levels) {
            throw "Could not find any requestedExecutionLevel in $($exe.Name) — the check cannot vouch for this build, so it is not published."
          }
          $bad = $levels | Where-Object { $_ -in 'requireAdministrator', 'highestAvailable' }
          if ($bad) {
            throw "$($exe.Name) is manifested as $($bad -join ', ') — set nsis.perMachine to false."
          }
          Write-Host "$($exe.Name) installs per-user ($($levels -join ', ')), no UAC."

      - name: Publish installer to the "agent-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Remote agent (latest build)
          files: bv-remote/agent/dist/*.exe

      # The dashboard reads this file to build the manifest entry. Writing it here
      # means the url, version and sha256 always describe the asset just published
      # — there is no hash to copy by hand and nothing to forget after a rebuild.
      - name: Record the published build for the dashboard
        shell: pwsh
        run: |
          $exe = Get-ChildItem bv-remote/agent/dist/*.exe | Select-Object -First 1
          $version = (Get-Content bv-remote/agent/package.json -Raw | ConvertFrom-Json).version
          $build = [ordered]@{
            version  = $version
            url      = "https://github.com/${{ github.repository }}/releases/download/agent-latest/$($exe.Name)"
            sha256   = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            builtAt  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $build | ConvertTo-Json | Set-Content web/src/tools/remote/agent-build.json -Encoding utf8
          Get-Content web/src/tools/remote/agent-build.json

      - name: Commit the build record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/tools/remote/agent-build.json
          if git diff --cached --quiet; then
            echo "build record unchanged"
            exit 0
          fi
          git commit -m "Remote agent build: record installer url + sha256 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
